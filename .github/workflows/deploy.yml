name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-jramirez-dev/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: portfolio-jramirez-dev

      - name: Build
        run: npm run build
        working-directory: portfolio-jramirez-dev
        env:
          VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-jramirez-dev/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
