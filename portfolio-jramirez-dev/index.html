<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jonathan Ramírez - Fullstack Developer .NET / C# especializado en Clean Architecture, Microservicios, React y Sistemas Empresariales de Alta Criticidad." />
    <meta name="robots" content="index, follow" />
    <!-- Security: prevent clickjacking via CSP meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Open Graph -->
    <meta property="og:title" content="Jonathan Ramírez · Fullstack Developer .NET / C#" />
    <meta property="og:description" content="Fullstack Developer con +5 años de experiencia en .NET, C#, Clean Architecture, Microservicios, React y SQL Server." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jonathan Ramírez · Fullstack Developer .NET / C#</title>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '%VITE_GA_MEASUREMENT_ID%');
    </script>
    <!-- Theme init (anti-FOUC) -->
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        const pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', saved === 'light' || saved === 'dark' ? saved : pref);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- GoatCounter: analytics sin cookies. no_onload evita el conteo automático;
         el hook useVisitCounter dispara count() solo una vez por sesión de pestaña. -->
    <script
      data-goatcounter="https://jramirez-dev.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
