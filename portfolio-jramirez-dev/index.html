<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio de J. Ramirez - Senior Software Developer especializado en React, Node.js y Cloud Architecture." />
    <meta name="robots" content="index, follow" />
    <!-- Security: prevent clickjacking via CSP meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Open Graph -->
    <meta property="og:title" content="J. Ramirez · Senior Developer" />
    <meta property="og:description" content="Full Stack Developer | React | Node.js | Cloud Architecture" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>J. Ramirez · Senior Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- GoatCounter: analytics sin cookies. no_onload evita el conteo automático;
         el hook useVisitCounter dispara count() solo una vez por sesión de pestaña. -->
    <script
      data-goatcounter="https://jramirez-dev.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
